# ─── Site ───────────────────────────────────────────────
title: "Sougata Panda | সৌগত পণ্ডা"
description: "PhD student in mathematics."   # TODO: name the institution
author: "Sougata Panda"
lang: en

url: "https://sougata543.github.io"
baseurl: ""

# ─── Navigation ─────────────────────────────────────────
# Single source of truth for the header nav. Add a line here
# and the link appears on every page.
nav:
  - title: Home
    url: /
  - title: Research
    url: /research.html
  - title: Archive
    url: /mmath.html
  - title: Others
    url: /other.html

# ─── Build ──────────────────────────────────────────────
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Every page gets the default layout, so front matter only
# needs a title. Add `math: true` to a page to load MathJax.
defaults:
  - scope:
      path: ""
    values:
      layout: default
