<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme: set before the stylesheet is applied, so no flash. -->
  <script>
    function toggleTheme() {
      var root = document.documentElement;
      var next = root.classList.contains('dark') ? 'light' : 'dark';
      root.className = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    }
    (function () {
      try {
        document.documentElement.className = localStorage.getItem('theme') || 'dark';
      } catch (e) {}
    })();
  </script>

  {% seo %}
  {% feed_meta %}

  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <!-- Bengali subset: only the glyphs in the site name. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400&text=%E0%A6%B8%E0%A7%8C%E0%A6%97%E0%A6%A4%20%E0%A6%AA%E0%A6%A3%E0%A7%8D%E0%A6%A1%E0%A6%BE&display=swap">

  {% if page.math %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>

<body>
  <div class="content">
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
